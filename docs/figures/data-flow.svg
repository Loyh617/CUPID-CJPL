  <text x="512" y="700" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203047">Build selected records at event end</text>
  <rect x="960" y="235" width="410" height="195" rx="12" fill="#eef8f4" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="982" y="269" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#286a51">SAVED FIELDS</text>
  <text x="982" y="303" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">Event: RunID, EventID, Edep</text>
  <text x="982" y="334" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">Incident: RunID, EventID,</text>
  <text x="982" y="362" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">TrackID, PDG, Edep</text>
  <text x="982" y="394" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203047">Detector name routes records to TTrees</text>
  <text x="982" y="417" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203047">Saved totals &gt; 0; Edep in keV</text>
  <rect x="960" y="470" width="410" height="260" rx="12" fill="#eef8f4" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="982" y="505" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#286a51">RECORD</text>
  <text x="982" y="544" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#203047">RecordManager</text>
  <text x="982" y="582" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#203047">EventEnergyRecorder</text>
  <text x="982" y="610" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203047">Total deposited energy per detector</text>
  <text x="982" y="650" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#203047">IncidentEnergyRecorder</text>
  <text x="982" y="678" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047">Detector-local incident root + descendants</text>
  <text x="982" y="712" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203047">EventAction dispatches typed vectors</text>
  <rect x="1410" y="235" width="460" height="195" rx="12" fill="#fff6ec" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="1432" y="269" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#97612b">ROOT LAYOUT · SCHEMA 4</text>
  <text x="1432" y="307" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#203047">One ROOT file per recorder</text>
  <text x="1432" y="343" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203047">One TTree per detector: LMO0, LMO1</text>
  <text x="1432" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203047">Numeric branches; no DetectorName branch</text>
  <text x="1432" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">Rows need not be in EventID order</text>
  <rect x="1410" y="470" width="460" height="260" rx="12" fill="#fff6ec" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="1432" y="505" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#97612b">OUTPUT</text>
  <text x="1432" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#203047">OutputManager → RootOutput</text>
  <text x="1432" y="582" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203047">Explicit booking / filling for each record type</text>
  <text x="1432" y="624" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#203047">G4AnalysisManager</text>
  <text x="1432" y="661" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">Native ntuples · per-ntuple file routing</text>
  <text x="1432" y="697" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#203047">Native thread merging</text>
