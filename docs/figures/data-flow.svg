<text x="542" y="493" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">Primary + secondary tracks / steps</text>
<rect x="520" y="570" width="370" height="105" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="542" y="606" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">LMOSensitiveDetector</text>
<text x="542" y="643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172536">DetectorHit collections: visits + Edep</text>
<rect x="520" y="720" width="370" height="100" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="542" y="756" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">TrackingAction</text>
<text x="542" y="793" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172536">TrackAncestry: parent / birth volume</text>
<rect x="940" y="280" width="420" height="145" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="962" y="316" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">EventAction</text>
<text x="962" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172536">Clear per-event state; collect hits / ancestry</text>
<text x="962" y="383" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">Build selected records at event end</text>
<text x="962" y="413" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">Pass typed vectors to output.Write(...)</text>
<rect x="940" y="530" width="420" height="250" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="962" y="566" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">03  RECORD</text>
<text x="962" y="603" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">RecordManager → selected recorders</text>
<text x="962" y="633" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">EventEnergyRecorder</text>
<text x="962" y="663" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#172536">  Sum both electrons and secondaries per LMO</text>
<text x="962" y="693" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">IncidentEnergyRecorder</text>
<text x="962" y="723" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">  Detector-local root + descendant Edep</text>
<text x="962" y="753" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">Return vectors; retain total Edep &gt; 0</text>
<rect x="1410" y="280" width="460" height="145" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="1432" y="316" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">RunAction + OutputMessenger</text>
<text x="1432" y="353" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">/cupid/output/fileName  |  directory</text>
<text x="1432" y="383" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">Reserve run paths; open / close output</text>
<text x="1432" y="413" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">Share resolved names across workers</text>
<rect x="1410" y="530" width="460" height="250" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="1432" y="566" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">04  OUTPUT</text>
<text x="1432" y="603" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">OutputManager → VOutput → RootOutput</text>
<text x="1432" y="633" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">Explicit typed Write() overloads</text>
<text x="1432" y="663" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">G4AnalysisManager: book / fill ntuples</text>
<text x="1432" y="693" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">One ROOT file per recorder</text>
<text x="1432" y="723" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">One TTree per enabled LMO in each file</text>
<text x="1432" y="753" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">Native Geant4 multithread merging</text>
