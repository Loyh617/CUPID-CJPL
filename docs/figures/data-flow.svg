<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>CUPID-CJPL Simulation Framework — Data Flow</title>
<desc>Geometry and primary generation feed Geant4 transport. Sensitive-detector hits and track ancestry feed event and incident-energy recorders. Typed records are written through native Geant4 ROOT analysis. Run actions control output, and a consolidated log preserves configuration and results.</desc>
