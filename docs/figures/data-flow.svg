  <text x="50" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#52657b">Scope: deposited energy in LMO; detector response, electronics and waveforms are outside the current implementation.</text>
  <text x="50" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#52657b">Dedicated environmental, copper-frame, cosmic, calibration and double-beta source models remain extension work.</text>
  <text x="50" y="1070" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52657b">Snapshot: 03 Nov 2026  |  Assistant test artifacts: ./results/tests/  |  Output parent is configurable via CLI or macro.</text>
  <text x="50" y="218" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52657b">main + ActionInitialization connect the geometry, physics and per-thread user actions.</text>
