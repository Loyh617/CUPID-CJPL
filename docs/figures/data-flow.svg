<text x="542" y="353" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">EM · decay · hadronic processes</text>
<rect x="520" y="420" width="370" height="105" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
