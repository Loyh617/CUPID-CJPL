<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CUPID-CJPL Simulation Framework — Data Flow</title>
  <desc id="desc">Current implemented data flow: geometry and the particle gun feed Geant4 transport. Detector hits and track ancestry are processed by EventAction and selected recorders. Typed vectors pass through OutputManager and RootOutput to native Geant4 ROOT analysis. Each run has a dedicated directory with separate recorder files, detector TTrees and its own log.</desc>
  <rect width="1920" height="1080" fill="white" />
  <text x="50" y="64" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#203047">CUPID-CJPL Simulation Framework</text>
  <text x="50" y="101" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52657b">Data flow | Geometry, sources, detector records and per-run results</text>
  <text x="1450" y="101" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#52657b">Solid: data    Dashed: control</text>
  <rect x="50" y="126" width="1820" height="67" rx="12" fill="#f3f6fa" stroke="#c4d0dc" stroke-width="1.5" />
