  <rect x="50" y="800" width="875" height="160" rx="12" fill="#f3f6fa" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="75" y="837" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#203047">RunAction + RunLog</text>
  <text x="75" y="873" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#203047">Master selects directory / prefix; every thread opens and closes output.</text>
  <text x="75" y="906" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203047">Each log contains setup context, this run’s transport and result summary.</text>
  <text x="75" y="938" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#203047">Names shared across workers; collisions receive _1, _2, …</text>
  <rect x="960" y="800" width="910" height="160" rx="12" fill="#f3f6fa" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="983" y="835" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#203047">PER-RUN DIRECTORY</text>
  <text x="983" y="866" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#203047">./results/runs/&lt;prefix&gt;/</text>
  <text x="1010" y="897" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203047">&lt;prefix&gt;_EventEnergy.root    &lt;prefix&gt;_IncidentEnergy.root</text>
  <text x="1010" y="928" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047">run.log    •    Empty runs retain the log; empty ROOT files are removed.</text>
