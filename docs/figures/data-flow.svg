  <text x="295" y="169" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203047">Macro files · CLI options · Random seeds · Recorder selection in EventAction</text>
  <rect x="50" y="235" width="405" height="195" rx="12" fill="#eff6ff" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="72" y="270" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#245a90">GEOMETRY</text>
  <text x="72" y="307" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203047">Materials + GeometryManager</text>
  <text x="72" y="343" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047">Cryostat · InnerShielding · LMOArray</text>
  <text x="72" y="378" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#203047">DetectorConstruction</text>
  <text x="72" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">Stable names: LMO0, LMO1</text>
  <rect x="50" y="470" width="405" height="260" rx="12" fill="#f6f1fd" stroke="#c4d0dc" stroke-width="1.5" />
  <text x="72" y="505" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#72509e">GENERATOR</text>
  <text x="72" y="545" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#203047">PrimaryGeneratorAction</text>
  <text x="72" y="578" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">GeneratorManager → G4ParticleGun</text>
  <text x="72" y="611" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047">Operational source: /gun/ commands</text>
  <text x="72" y="657" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52657b">Reusable tools for future source models</text>
  <text x="72" y="688" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203047">Position samplers · NuclideEmitter</text>
  <text x="72" y="714" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52657b">Dedicated generators: placeholders</text>
