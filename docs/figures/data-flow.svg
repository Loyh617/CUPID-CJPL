<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1160" viewBox="0 0 1920 1160" role="img" aria-labelledby="title desc">
<title id="title">CUPID-CJPL — Framework Data Flow</title><desc id="desc">Geometry supplies LMO box placements to the Mo-100 generator. The gun or one correlated electron pair supplies primaries for transport. EventAction passes detector hits and ancestry to RecordManager, receives typed record vectors, and writes them through OutputManager. RunAction controls the output lifecycle; OutputMessenger binds run naming and directory commands. Solid arrows show data; dashed arrows show configuration or calls.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#595959"/></marker></defs><rect width="1920" height="1160" fill="white"/>
<text x="50" y="60" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0E419C">CUPID-CJPL Simulation Framework</text>
<text x="50" y="100" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#595959">Data flow | Four modules connected by Geant4 user actions</text>
<text x="1390" y="100" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#595959">Solid: data    Dashed: calls / control</text>
<rect x="50" y="130" width="1820" height="90" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="72" y="166" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">CONFIGURATION &amp; INITIALIZATION</text>
<text x="75" y="199" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#172536">main + ActionInitialization: geometry / physics registration, master RunAction, worker actions and dependencies</text>
<text x="50" y="247" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#595959">Macros → GeometryMessenger / GeneratorMessenger; /gun/ configures G4ParticleGun. Output commands → OutputMessenger; RunLog captures run context.</text>
<rect x="50" y="280" width="420" height="195" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="72" y="316" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">01  GEOMETRY</text>
<text x="72" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172536">DetectorConstruction → GeometryManager</text>
<text x="72" y="383" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">Materials; World + selected components</text>
<text x="72" y="413" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">Cryostat · InnerShielding · LMOArray</text>
<text x="72" y="443" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172536">Register LMO volumes and World transforms</text>
<polyline points="80,475 80,535" fill="none" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>
<text x="94" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#595959">Mo-100: center, rotation and box half lengths</text>
<rect x="50" y="535" width="420" height="230" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="72" y="571" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">02  GENERATOR</text>
<text x="72" y="608" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#172536">PrimaryGeneratorAction → GeneratorManager</text>
<text x="72" y="638" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">gun → G4ParticleGun</text>
<text x="72" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">Mo100TwoNu / Mo100ZeroNu</text>
<text x="72" y="698" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">DirectVolumeSampler → LMO vertex</text>
<text x="72" y="728" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172536">Two correlated electrons at one vertex</text>
