<text x="72" y="928" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172536">PointSampler · DirectVolumeSampler · DirectSurfaceSampler</text>
<text x="72" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172536">RejectionVolumeSampler: registered volume + placement transform</text>
<text x="72" y="988" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172536">NuclideEmitter: create a nuclide primary for a concrete generator</text>
<text x="72" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172536">Mo-100 uses SampleBox() for position and samples electron momenta locally.</text>
<rect x="940" y="855" width="930" height="205" rx="10" fill="#F2F5FA" stroke="#C5CFDF" stroke-width="1.5"/>
<text x="962" y="891" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0E419C">PER-RUN RESULTS  ·  ROOT SCHEMA 7</text>
<text x="962" y="928" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172536">./results/runs/&lt;prefix&gt;/  (configurable parent; collisions: _1, _2, …)</text>
<text x="962" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172536">&lt;prefix&gt;_EventEnergy.root     &lt;prefix&gt;_IncidentEnergy.root     run.log</text>
<text x="962" y="988" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172536">Event branches: RunID, EventID, Edep/keV</text>
