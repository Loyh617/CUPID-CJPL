  <text x="73" y="875" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#607087">Production runs (default parent)</text>
  <text x="73" y="971" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607087">main.cc is the application entry point.</text>
