<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>CUPID-CJPL Simulation Framework — File Structure</title>
  <desc>Current project layout. Matching include and src files are shown once by their base name. Geometry, generator, record, output, materials and top-level Geant4 integration files are listed. Header-only files, placeholder generators and reserved directories are explicitly marked.</desc>
