  <text x="73" y="672" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#607087">14 C++ / Python validation files</text>
  <text x="73" y="714" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#23344b">docs/</text>
  <text x="73" y="741" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#607087">figures/ + historical reuse audit</text>
  <text x="73" y="781" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#23344b">build/</text>
  <text x="73" y="808" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#607087">Binaries, build files, dependencies</text>
